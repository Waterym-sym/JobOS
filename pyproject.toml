[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "jobos-core"
version = "0.1.0"
description = "Local-only AI Resume OS service scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110,<0.120",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.30,<0.40",
]

[project.optional-dependencies]
dev = [
  "black>=24.10,<25",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<0.10",
]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["services"]
