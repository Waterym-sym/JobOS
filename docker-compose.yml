name: jobos

services:
  postgres:
    image: pgvector/pgvector:0.7.4-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobos}
      POSTGRES_USER: ${POSTGRES_USER:-jobos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobos} -d ${POSTGRES_DB:-jobos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      HOST_BIND: ${HOST_BIND:-127.0.0.1}
      API_PORT: ${API_PORT:-8000}
      WS_PORT: ${WS_PORT:-8788}
      CAPTURE_MIN_DELAY_MS: ${CAPTURE_MIN_DELAY_MS:-1800}
      CAPTURE_CONCURRENCY: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobos}
      CHAT_TO_THIRD_PARTY: "false"
      CONTAINER_MODE: "true"
      PAIRING_TOKEN_FILE: /workspace/config/.local/pairing.token
    ports:
      - "${HOST_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
      - "${HOST_BIND:-127.0.0.1}:${WS_PORT:-8788}:8788"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/config:/workspace/config/.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "-m", "services.worker.main"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker-renderer:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "services/worker-renderer/main.py"]
    volumes:
      - ./data/files:/workspace/data/files
      - ./data/templates:/workspace/data/templates
      - ./data/fonts:/workspace/data/fonts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${HOST_BIND:-127.0.0.1}:4173:4173"
    environment:
      API_UPSTREAM: http://api:8000
      PAIRING_TOKEN_FILE: /workspace/config/.local/pairing.token
    volumes:
      - ./data/config:/workspace/config/.local:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 10
